name: "Fotoarchiv"
description: "Foto- und Video-Datenbank: Zeitleiste, Weltkarte, Gesichtserkennung, Suche, Bearbeiten direkt in der Datei"
version: "0.07"
url: "https://github.com/gregorwolf1973/fotoarchiv-addon"
slug: "fotoarchiv"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
ingress: true
ingress_port: 8300
ingress_stream: true
panel_icon: "mdi:image-multiple"
panel_title: "Fotoarchiv"
map:
  - type: share
    read_only: false
  - type: media
    read_only: false
options:
  library_folder: "/media/fotoarchiv"
  import_folder: "/share/fotoarchiv-import"
  trash_days: 30
  face_recognition: true
schema:
  library_folder: str
  import_folder: str
  trash_days: int(1,365)
  face_recognition: bool
# Vorschaubilder und Erkennungsmodelle lassen sich jederzeit neu erzeugen bzw. laden und würden Backups aufblähen
backup_exclude:
  - "cache"
  - "cache/*"
  - "models"
  - "models/*"
