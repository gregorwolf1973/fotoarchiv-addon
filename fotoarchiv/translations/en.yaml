configuration:
  library_folder:
    name: Library
    description: >-
      Folder holding the archive. New files are sorted into YYYY/MM subfolders by capture date.
      Must be below /media or /share.
  import_folder:
    name: Import folder
    description: >-
      Inbox folder, e.g. reachable via Samba as \\homeassistant\share\fotoarchiv-import.
      Imported files are moved from here into the library.
  face_recognition:
    name: Face recognition
    description: >-
      Scan photos for faces in the background and group similar faces. Downloads the InsightFace models
      (about 280 MB, non-commercial use only) on first start. About 1 second per photo on a Raspberry Pi 5.
  face_threads:
    name: Cores for face recognition
    description: >-
      How many processor cores face recognition may use. More cores get through the photos faster but put a
      heavier load on the Pi. On a Raspberry Pi 5 (4 cores), 3 is a good value if Home Assistant should stay
      responsive. Takes effect after restarting the add-on.
  duplicate_detection:
    name: Detect duplicate photos
    description: >-
      Compare photos in the background to find duplicate versions (resized, re-saved, other format) and bursts of
      similar shots. Imports point out very similar existing photos. Very fast, a few milliseconds per photo.
  convert_on_import:
    name: Convert on import
    description: >-
      HEIC photos become JPEG, videos the browser cannot play (e.g. H.265/HEVC) become H.264 MP4. H.264 MOV files
      are only repackaged losslessly. The original goes to the trash. Videos take about as long as their running
      time on a Raspberry Pi. Convert existing files via the selection.
  auto_import:
    name: Import automatically
    description: >-
      Check the import folder every minute and import new, completely copied files on its own – e.g. for a phone
      uploading to the Samba share via FolderSync or PhotoSync over Wi-Fi. One way only: nothing is ever written
      back to the phone. Files already in the archive or trash are deleted instead of moved to _duplikate.
  map_language:
    name: Map labels
    description: >-
      de: German map style (openstreetmap.de) – countries and places in German, local names in brackets.
      local: openstreetmap.org – every country in its own language and script. Takes effect after reloading the page.
  public_enabled:
    name: Internet access
    description: >-
      Starts internet access on port 8301 with login (accounts under Fotoarchiv → shield icon).
      Never expose directly; publish only through a reverse proxy with TLS (Nginx Proxy Manager, Cloudflare Tunnel).
  public_trusted_proxies:
    name: Trusted proxies
    description: >-
      Addresses/networks of your reverse proxies. Only their client address headers (X-Forwarded-For,
      CF-Connecting-IP) are trusted. 172.30.32.0/23 is the internal Home Assistant network.
  public_cookie_secure:
    name: Session cookie over HTTPS only
    description: Turn off only for testing on your local network without TLS.
  public_session_hours:
    name: Session duration (hours)
    description: After this time users have to sign in again.
  public_log_export_path:
    name: Additional log file
    description: Optional copy of the access log. Not needed for CrowdSec – the setup button takes care of that.
  trash_days:
    name: Trash (days)
    description: Deleted files stay in the trash for this many days before they are permanently removed from disk.
