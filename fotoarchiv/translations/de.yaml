configuration:
  library_folder:
    name: Bibliothek
    description: >-
      Ordner, in dem das Archiv liegt. Neue Dateien werden nach Aufnahmedatum in Unterordner JJJJ/MM einsortiert.
      Muss unter /media oder /share liegen.
  import_folder:
    name: Import-Ordner
    description: >-
      Eingangsordner, z. B. per Samba als \\homeassistant\share\fotoarchiv-import erreichbar.
      Nach dem Import sind die Dateien von hier in die Bibliothek verschoben.
  face_recognition:
    name: Gesichtserkennung
    description: >-
      Fotos im Hintergrund nach Gesichtern durchsuchen und ähnliche Gesichter gruppieren. Lädt beim ersten Start
      die InsightFace-Modelle (ca. 280 MB, nur nicht-kommerzielle Nutzung) herunter. Auf dem Raspberry Pi 5 etwa
      1 Sekunde pro Foto.
  face_threads:
    name: Kerne für die Gesichtserkennung
    description: >-
      Wie viele Prozessorkerne die Gesichtserkennung nutzen darf. Mehr Kerne gehen schneller durch die Fotos,
      lasten den Pi aber stärker aus. Beim Raspberry Pi 5 (4 Kerne) sind 3 ein guter Wert, wenn Home Assistant
      flüssig bleiben soll. Die Änderung wirkt nach einem Neustart des Add-ons.
  duplicate_detection:
    name: Doppelte Fotos erkennen
    description: >-
      Fotos im Hintergrund vergleichen und doppelte Fassungen (verkleinert, neu gespeichert, anderes Format) sowie
      Serien ähnlicher Aufnahmen finden. Beim Import wird auf sehr ähnliche vorhandene Fotos hingewiesen. Sehr schnell,
      einige Millisekunden pro Foto.
  duplicate_bits:
    name: Strenge bei doppelten Fotos
    description: >-
      Wie viele der 64 Bits des Bild-Fingerabdrucks abweichen dürfen, damit zwei Fotos als doppelt gelten.
      Kleiner heißt strenger: 6 ist der Standard und findet auch aufgehellte oder nachbearbeitete Fassungen,
      4 nimmt fast nur noch echte Kopien, 7 ist die großzügigste Einstellung. Landet zu viel bloß Ähnliches in
      der Liste, stelle den Wert herunter. Die Änderung wirkt nach einem Neustart des Add-ons.
  series_bits:
    name: Strenge bei Serien
    description: >-
      Wie viele der 64 Bits abweichen dürfen, damit zwei Fotos, die höchstens 30 Sekunden auseinander
      aufgenommen wurden, als Serie gelten. Standard 12. Kleiner heißt strenger, größer fasst auch Aufnahmen
      mit mehr Bewegung zusammen. Die Änderung wirkt nach einem Neustart des Add-ons.
  convert_on_import:
    name: Beim Import umwandeln
    description: >-
      HEIC-Fotos werden zu JPEG, Videos, die der Browser nicht abspielen kann (z. B. H.265/HEVC), zu MP4 mit H.264.
      MOV mit H.264 wird nur verlustfrei umgepackt. Das Original kommt in den Papierkorb. Videos brauchen auf dem
      Raspberry Pi etwa so lange, wie sie dauern. Vorhandene Dateien wandelst du über die Auswahl um.
  auto_import:
    name: Automatisch importieren
    description: >-
      Den Import-Ordner jede Minute prüfen und neue, fertig kopierte Dateien selbst einlesen – etwa für ein Handy,
      das per FolderSync oder PhotoSync im WLAN in den Samba-Ordner hochlädt. Nur in eine Richtung: aufs Handy
      wird nie geschrieben. Dateien, die schon im Archiv oder im Papierkorb liegen, werden gelöscht statt in
      _duplikate verschoben.
  map_language:
    name: Kartenbeschriftung
    description: >-
      de: deutscher Kartenstil (openstreetmap.de) – Länder und Orte auf Deutsch, die Landessprache in Klammern.
      local: openstreetmap.org – jedes Land in seiner eigenen Sprache und Schrift. Wirkt nach dem Neuladen der Seite.
  public_enabled:
    name: Internetzugang
    description: >-
      Startet den Internetzugang auf Port 8301 mit Anmeldung (Konten unter Fotoarchiv → Schild-Symbol).
      Nie direkt freigeben, sondern über einen Reverse Proxy mit TLS (Nginx Proxy Manager, Cloudflare Tunnel).
  public_trusted_proxies:
    name: Vertrauenswürdige Proxys
    description: >-
      Adressen/Netze der Reverse Proxys. Nur deren Angaben zur Besucheradresse (X-Forwarded-For,
      CF-Connecting-IP) werden geglaubt. 172.30.32.0/23 ist das interne Home-Assistant-Netz.
  public_cookie_secure:
    name: Sitzungs-Cookie nur über HTTPS
    description: Ausschalten nur zum Testen im eigenen Netz ohne TLS.
  public_session_hours:
    name: Sitzungsdauer (Stunden)
    description: Nach dieser Zeit muss man sich neu anmelden.
  public_log_export_path:
    name: Zusätzliche Protokolldatei
    description: >-
      Optional: Kopie des Zugriffsprotokolls, z. B. für eigene Auswertungen. Für CrowdSec nicht nötig –
      die Einrichtung über das Schild-Symbol erledigt das.
  trash_days:
    name: Papierkorb (Tage)
    description: Gelöschte Dateien bleiben so viele Tage im Papierkorb und werden danach endgültig vom Datenträger gelöscht.
